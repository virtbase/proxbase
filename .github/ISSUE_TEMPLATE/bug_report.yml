name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command you ran, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Output of the failing command and `proxbase doctor`. Remove passwords and tokens.
      render: text
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Cluster file
      description: Your cluster.yaml or the create flags, if any.
      render: yaml
  - type: input
    id: version
    attributes:
      label: Versions
      description: "`proxbase version`, host OS, QEMU version"
    validations:
      required: true

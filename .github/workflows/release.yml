name: Release

on:
  push:
    branches: [main]
  # Re-run GoReleaser for an existing release tag (e.g. after a failed run).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0
        required: true

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs in the same workflow: tags pushed with GITHUB_TOKEN trigger no other workflows.
  goreleaser:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    permissions:
      contents: write # upload release assets
      packages: write # push to GHCR
      id-token: write # cosign keyless signing, provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit, in case several tags point at the release commit.
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  # Moves the major tag (v0, v1, ...) used by `uses: virtbase/proxbase@v0`.
  action-tag:
    needs: [release-please, goreleaser]
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - run: |
          major="${RELEASE_TAG%%.*}"
          git tag -f "$major" "$RELEASE_TAG^{commit}"
          git push -f origin "refs/tags/$major"

  # Publishes server.json for the released image to the MCP registry
  # (registry.modelcontextprotocol.io), authenticated by the workflow's OIDC token.
  mcp-registry:
    needs: [release-please, goreleaser]
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc # mcp-publisher_linux_amd64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Set version and image tag
        run: |
          version="${RELEASE_TAG#v}"
          jq --arg v "$version" '.version = $v | .packages[0].identifier = "ghcr.io/virtbase/proxbase:" + $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json
      - name: Wait for the image
        run: |
          # The registry checks the image's io.modelcontextprotocol.server.name label.
          image="ghcr.io/virtbase/proxbase:${RELEASE_TAG#v}"
          for _ in $(seq 30); do
            docker buildx imagetools inspect "$image" --format '{{json .Image.Config.Labels}}' 2>/dev/null |
              jq -e '."io.modelcontextprotocol.server.name" == "io.github.virtbase/proxbase"' >/dev/null && exit 0
            sleep 10
          done
          echo "::error::$image is not pullable or lacks the MCP label"
          exit 1
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

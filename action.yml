name: Proxbase
description: Create a Proxmox VE cluster in QEMU/KVM on the runner for integration tests
author: virtbase
branding:
  icon: server
  color: orange

inputs:
  version:
    description: proxbase release to install, e.g. v0.2.0, or "latest"
    default: latest
  binary:
    description: Path to a proxbase binary to use instead of downloading a release
    default: ""
  name:
    description: Cluster name
    default: ci
  config:
    description: Cluster file (YAML); the inputs below override it
    default: ""
  nodes:
    description: Number of nodes
    default: "1"
  memory:
    description: Memory per node, e.g. 4G
    default: ""
  data-disks:
    description: Data disks per node, e.g. 2x32G or none
    default: ""
  storage:
    description: Storage on the data disks (zfs, ceph or none)
    default: ""
  pve-version:
    description: Proxmox VE ISO version, e.g. 9.2
    default: ""
  golden:
    description: Clone nodes from a cached base image (faster with cache)
    default: "true"
  cache:
    description: Cache the ISO and base image with actions/cache
    default: "true"
  template:
    description: >-
      Cache the ready cluster as a live snapshot (memory included) and resume it in
      later runs instead of creating it; needs golden and cache
    default: "false"
  verify-signature:
    description: Also verify the release signature with cosign (cosign must be installed)
    default: "false"
  github-token:
    description: Token for the GitHub API (release lookup)
    default: ${{ github.token }}

outputs:
  cluster:
    description: Cluster name
    value: ${{ inputs.name }}
  endpoint:
    description: API endpoint, e.g. https://127.0.0.1:18001/
    value: ${{ steps.env.outputs.endpoint }}
  api-token:
    description: API token (user@realm!id=secret)
    value: ${{ steps.env.outputs.api-token }}
  ca-cert:
    description: Path of the cluster CA certificate
    value: ${{ steps.env.outputs.ca-cert }}
  ssh-key:
    description: Path of the root SSH private key
    value: ${{ steps.env.outputs.ssh-key }}
  env-file:
    description: Shell file exporting PROXMOX_VE_* and PROXBASE_* variables (source it)
    value: ${{ steps.env.outputs.env-file }}

runs:
  using: composite
  steps:
    - name: Enable KVM
      shell: bash
      run: |
        if [ ! -e /dev/kvm ]; then
          echo "::error::/dev/kvm does not exist: this runner's host does not expose nested virtualization ($(nproc) CPUs, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs), vmx/svm: $(grep -cwE 'vmx|svm' /proc/cpuinfo)). Re-run the job, or use a larger or self-hosted runner."
          exit 1
        fi
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        # trigger only queues the event; wait for udevd to apply the rule
        sudo udevadm settle --timeout=30 || true
        test -w /dev/kvm || sudo chmod 0666 /dev/kvm
        test -w /dev/kvm || { ls -l /dev/kvm; echo "::error::/dev/kvm is not writable"; exit 1; }

    - name: Install QEMU
      shell: bash
      run: |
        if ! command -v qemu-system-x86_64 >/dev/null || ! command -v qemu-img >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils >/dev/null
        fi

    - name: Install proxbase
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        BINARY: ${{ inputs.binary }}
        VERIFY: ${{ inputs.verify-signature }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        bindir="$RUNNER_TEMP/proxbase-bin"
        mkdir -p "$bindir"
        if [ -n "$BINARY" ]; then
          install -m 0755 "$BINARY" "$bindir/proxbase"
        else
          if [ "$VERSION" = latest ]; then
            VERSION=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/virtbase/proxbase/releases/latest | jq -r .tag_name)
          fi
          arch=$(uname -m); case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
          base="https://github.com/virtbase/proxbase/releases/download/$VERSION"
          archive="proxbase_${VERSION#v}_linux_${arch}.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          if [ "$VERIFY" = true ]; then
            curl -fsSLO "$base/checksums.txt.sigstore.json"
            cosign verify-blob --bundle checksums.txt.sigstore.json \
              --certificate-identity-regexp '^https://github.com/virtbase/proxbase/\.github/workflows/release\.yml@' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          fi
          tar -xzf "$archive" -C "$bindir" proxbase
        fi
        echo "$bindir" >> "$GITHUB_PATH"
        "$bindir/proxbase" version
        echo "version=$("$bindir/proxbase" version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

    - name: Restore ISO and base image cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/proxbase
        key: proxbase-${{ runner.os }}-${{ runner.arch }}-${{ steps.install.outputs.version }}-${{ inputs.pve-version }}
        restore-keys: |
          proxbase-${{ runner.os }}-${{ runner.arch }}-

    - name: Template cache key
      id: template
      if: inputs.template == 'true'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        CONFIG: ${{ inputs.config }}
        INPUTS: ${{ inputs.nodes }}|${{ inputs.memory }}|${{ inputs.data-disks }}|${{ inputs.storage }}|${{ inputs.pve-version }}
        VERSION: ${{ steps.install.outputs.version }}
      run: |
        set -euo pipefail
        # A live snapshot only loads into the same QEMU on the same CPU model.
        {
          echo "$INPUTS"
          [ -n "$CONFIG" ] && sha256sum < "$CONFIG"
          qemu-system-x86_64 --version | head -n 1
          grep -m 1 '^model name' /proc/cpuinfo
          grep -m 1 '^flags' /proc/cpuinfo
        } > "$RUNNER_TEMP/proxbase-template-key"
        echo "key=proxbase-template-$NAME-$VERSION-$(sha256sum < "$RUNNER_TEMP/proxbase-template-key" | cut -c1-16)" >> "$GITHUB_OUTPUT"
        echo "path=${XDG_DATA_HOME:-$HOME/.local/share}/proxbase/clusters/$NAME" >> "$GITHUB_OUTPUT"

    - name: Restore cluster template
      id: template-cache
      if: inputs.template == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.template.outputs.path }}
        key: ${{ steps.template.outputs.key }}

    - name: Create cluster
      id: create
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        CONFIG: ${{ inputs.config }}
        NODES: ${{ inputs.nodes }}
        MEMORY: ${{ inputs.memory }}
        DATA_DISKS: ${{ inputs.data-disks }}
        STORAGE: ${{ inputs.storage }}
        PVE_VERSION: ${{ inputs.pve-version }}
        GOLDEN: ${{ inputs.golden }}
        TEMPLATE: ${{ inputs.template }}
        TEMPLATE_HIT: ${{ steps.template-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        if [ "$TEMPLATE_HIT" = true ]; then
          if proxbase snapshot restore "$NAME" template; then
            exit 0
          fi
          echo "::warning::could not resume the cached cluster template; creating the cluster"
          proxbase destroy "$NAME" --yes
        fi
        args=(create "$NAME")
        [ -n "$CONFIG" ] && args+=(-f "$CONFIG")
        [ -n "$NODES" ] && args+=(--nodes "$NODES")
        [ -n "$MEMORY" ] && args+=(--memory "$MEMORY")
        [ -n "$DATA_DISKS" ] && args+=(--data-disks "$DATA_DISKS")
        [ -n "$STORAGE" ] && args+=(--storage "$STORAGE")
        [ -n "$PVE_VERSION" ] && args+=(--pve-version "$PVE_VERSION")
        [ "$GOLDEN" = true ] && args+=(--golden)
        if ! proxbase "${args[@]}"; then
          logs="${XDG_DATA_HOME:-$HOME/.local/share}/proxbase/clusters/$NAME/logs"
          for f in "$logs"/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f")"
            tail -n 100 "$f"
            echo "::endgroup::"
          done
          exit 1
        fi
        if [ "$TEMPLATE" = true ] && [ "$TEMPLATE_HIT" != true ]; then
          # Snapshot the ready cluster, stop it so the disk images are not written
          # while they are cached, and resume it from the snapshot after saving.
          proxbase snapshot save "$NAME" template --live
          proxbase stop "$NAME" --timeout 0
          echo "save-template=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save cluster template
      if: steps.create.outputs.save-template == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.template.outputs.path }}
        key: ${{ steps.template.outputs.key }}

    - name: Resume cluster template
      if: steps.create.outputs.save-template == 'true'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: proxbase snapshot restore "$NAME" template

    - name: Export credentials
      id: env
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/proxbase-$NAME"
        proxbase env "$NAME" --export "$dir"
        proxbase env "$NAME" --format json > "$dir/env.json"
        echo "::add-mask::$(jq -r .tokenSecret "$dir/env.json")"
        echo "::add-mask::$(jq -r .rootPassword "$dir/env.json")"
        {
          echo "endpoint=$(jq -r .endpoint "$dir/env.json")"
          echo "api-token=$(jq -r .apiToken "$dir/env.json")"
          echo "ca-cert=$dir/pve-root-ca.pem"
          echo "ssh-key=$dir/id_ed25519"
          echo "env-file=$dir/env.sh"
        } >> "$GITHUB_OUTPUT"
        rm "$dir/env.json"

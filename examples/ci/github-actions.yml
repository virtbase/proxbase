# Example workflow: run tests against a real single-node Proxmox VE cluster on a
# GitHub-hosted Linux runner (they expose /dev/kvm). Copy to .github/workflows/.
# Pin the action to a release tag or, better, its commit SHA.
name: Proxmox integration tests

on: [pull_request]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Installs QEMU and proxbase, enables KVM, caches the ISO and base image,
      # and creates the cluster. Outputs: endpoint, api-token, ca-cert, ssh-key, env-file.
      - id: pve
        uses: virtbase/proxbase@v0
        with:
          name: ci
          nodes: "1"
          # config: test/cluster.yaml   # or a cluster file

      - name: Run tests
        env:
          PVE_ENV: ${{ steps.pve.outputs.env-file }}
        run: |
          . "$PVE_ENV"   # PROXMOX_VE_ENDPOINT, PROXMOX_VE_API_TOKEN, PROXBASE_CA_CERT, ...
          curl -sf --cacert "$PROXBASE_CA_CERT" -H "Authorization: PVEAPIToken=$PROXMOX_VE_API_TOKEN" \
            "${PROXMOX_VE_ENDPOINT}api2/json/version"
          # your tests here, e.g. go test ./... -tags integration
          proxbase ssh ci -- pvesh get /cluster/resources --output-format json

      # Composite actions have no post step: destroy the cluster explicitly.
      - name: Destroy cluster
        if: always()
        run: proxbase destroy ci --yes

# The smallest useful setup: one node, no data disks, local storage only.
# Good for trying the web UI, API clients or Ansible roles. About 2.5 minutes.
#   proxbase create -f examples/single-node.yaml
apiVersion: proxbase.virtbase.com/v1alpha1
kind: Cluster
name: single
nodes:
  count: 1
  defaults:
    cpus: 2
    memory: 4G
    dataDisks: []
